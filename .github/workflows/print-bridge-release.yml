name: Print Bridge installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version shown in the build record
        required: true
        default: 1.0.0
  push:
    branches: [main]
    paths:
      - '.github/workflows/print-bridge-release.yml'
      - 'installer/**'
      - 'print-bridge.js'
      - 'install-print-bridge-windows.ps1'
      - 'install-print-bridge-macos.sh'
      - 'scripts/package-print-bridge-windows.ps1'
      - 'scripts/package-print-bridge-macos.sh'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: choco install innosetup --no-progress --yes
      - run: npm ci
      - run: npm run package:bridge:windows
      - name: Sign Windows installer
        if: env.WINDOWS_CERTIFICATE_P12_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'red-lantern-code-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_P12_BASE64))
          & signtool.exe sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD 'releases\Red-Lantern-Print-Bridge-Windows-Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer signing failed.' }
          Remove-Item -LiteralPath $certificate -Force
      - name: Verify Windows signature
        if: env.WINDOWS_CERTIFICATE_P12_BASE64 != ''
        shell: pwsh
        run: |
          & signtool.exe verify /pa /v 'releases\Red-Lantern-Print-Bridge-Windows-Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer signature verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Red-Lantern-Print-Bridge-Windows
          path: releases/Red-Lantern-Print-Bridge-Windows-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      MAC_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 }}
      MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
      MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Import macOS installer certificate
        if: env.MAC_INSTALLER_CERTIFICATE_P12_BASE64 != ''
        env:
          MAC_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/red-lantern-installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/red-lantern-build.keychain-db"
          echo "$MAC_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Configure Apple notarization
        if: env.APPLE_NOTARY_API_KEY_BASE64 != ''
        env:
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "$APPLE_NOTARY_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool store-credentials RedLanternNotary --key "$KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
      - run: npm run package:bridge:macos
        env:
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 != '' && 'RedLanternNotary' || '' }}
      - name: Verify macOS installer signature
        if: env.MAC_INSTALLER_CERTIFICATE_P12_BASE64 != ''
        run: pkgutil --check-signature releases/Red-Lantern-Print-Bridge-macOS.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Red-Lantern-Print-Bridge-macOS
          path: releases/Red-Lantern-Print-Bridge-macOS.pkg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: Publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${REQUESTED_VERSION:-1.0.${RUN_NUMBER}}"
          gh release create "print-bridge-v${VERSION}" releases/Red-Lantern-Print-Bridge-Windows-Setup.exe releases/Red-Lantern-Print-Bridge-macOS.pkg --title "Print Bridge ${VERSION}" --generate-notes
