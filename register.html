<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#020617">
    <title>Red Lantern Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/register.css?v=5">
    <link rel="stylesheet" href="/register-polish.css?v=5">
    <style>
      .register-grid { height: calc(100dvh - 72px); min-height: 0; }
      .register-list { flex: 1; overscroll-behavior: contain; }
      @media (max-width: 1100px) {
        .register-grid { height: auto; min-height: calc(100dvh - 72px); }
        .register-panel { height: min(64dvh, 560px); }
      }
      @media (max-width: 680px) {
        .register-grid { min-height: calc(100dvh - 64px); }
      }
    </style>
  </head>
  <body>
    <header class="register-topbar">
      <a class="brand" href="/orders" aria-label="Back to orders"><span>R</span><div><b>Red Lantern Register</b><small>Counter Fast-Checkout Dashboard</small></div></a>
      <div class="summary" aria-label="Register summary"><span>Tables: <b id="active-tables" class="amber">0 Active</b></span><span>Parcels: <b id="pending-parcels" class="sky">0 Pending</b></span></div>
      <div class="live"><button type="button" id="print-summary" class="print-summary">Print summary</button><time id="clock"></time><span><i id="connection-dot"></i><b id="connection-label">Live</b></span></div>
    </header>
    <main class="register-grid">
      <section class="register-panel tables-panel"><header><h1><i></i>Dine-In Tables</h1><b id="table-badge">0 Active</b></header><div id="tables-list" class="register-list" aria-live="polite"></div></section>
      <section class="register-panel parcels-panel"><header><h1><i></i>Ongoing Parcels</h1><b id="parcel-badge">0 Pending</b></header><div id="parcels-list" class="register-list" aria-live="polite"></div></section>
    </main>
    <dialog id="bill-modal"><button class="modal-close" aria-label="Close">×</button><div id="bill-content"></div></dialog>
    <dialog id="payment-modal" class="payment-modal"><button type="button" class="payment-close" aria-label="Close">×</button><p class="payment-eyebrow">Payment collection</p><h2 id="payment-title">Cash payment</h2><p id="payment-order"></p><div class="payment-due"><span>Bill total</span><b id="payment-due">₹0</b></div><label id="payment-received-label" for="payment-received">Cash received from customer</label><input id="payment-received" type="number" min="0" step="0.01" inputmode="decimal"><p id="payment-preview" aria-live="polite"></p><div class="payment-actions"><button type="button" class="payment-cancel">Cancel</button><button type="button" id="payment-confirm">Save payment</button></div></dialog>
    <template id="empty-template"><div class="empty-state">No active orders at the counter.</div></template>
    <script src="/register.js?v=5"></script>
  </body>
</html>
