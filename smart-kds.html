<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Red Lantern Smart KDS</title><link rel="stylesheet" href="/smart-kds.css?v=2"><link rel="stylesheet" href="/smart-kds-batch.css?v=2"><link rel="stylesheet" href="/smart-kds-controls.css?v=2"><link rel="stylesheet" href="/smart-kds-smart.css?v=5"></head><body>
<header><a href="/orders">Red Lantern <small>Smart Kitchen Display</small></a><div class="topbar-tools"><span id="live" class="live-state">Loading board…</span><label class="operator-field"><span>Kitchen staff</span><input id="operator" type="text" maxlength="100" autocomplete="name" placeholder="Your name"></label><time id="clock"></time><button id="fullscreen">Fullscreen</button></div></header>
<main><section class="intro"><div><span>SMART KDS</span><h1>Kitchen board</h1><p id="display-mode-copy">All kitchen stations</p></div><div class="kitchen-toolbar"><label><span>Station</span><select id="station-filter" aria-label="Choose a kitchen station"><option value="all">All kitchen stations</option></select></label><a class="normal" href="/kds">Normal KDS</a></div></section><section id="board" class="board" aria-live="polite"></section><details class="manager-details"><summary>Manager details</summary><div class="manager-details-body"><label class="manager-category">Menu category<select id="category-filter" aria-label="Filter Smart KDS by the existing Air Menu category"><option value="all">All menu categories</option></select></label><section id="stale-orders" class="stale-orders" hidden aria-live="polite"></section><section id="summary" class="summary" aria-label="Kitchen action summary"></section><p id="status" role="status">Loading kitchen recommendations…</p></div></details></main><dialog id="timeline-dialog" class="timeline-dialog"><div class="timeline-head"><div><span>TABLE / ORDER TIMELINE</span><h2 id="timeline-title">Order timeline</h2></div><button type="button" id="timeline-close" aria-label="Close timeline">×</button></div><div id="timeline-content"></div></dialog><dialog id="override-dialog" class="override-dialog"><form id="override-form"><div class="timeline-head"><div><span>AUTHORISED KITCHEN OVERRIDE</span><h2 id="override-title">Update kitchen task</h2></div><button type="button" id="override-close" aria-label="Close override form">×</button></div><div class="override-body"><p id="override-task" class="override-task"></p><label>Action<select id="override-action"></select></label><label id="override-course-wrap" hidden>Course<select id="override-course"><option value="drink">Drink</option><option value="soup">Soup</option><option value="starter">Starter</option><option value="main">Main</option><option value="side">Side</option><option value="dessert">Dessert</option><option value="other">Other</option></select></label><label id="override-station-wrap" hidden>Kitchen station<select id="override-station"></select></label><label>Reason<textarea id="override-reason" required minlength="3" maxlength="240" placeholder="Why is this change needed?"></textarea></label><div class="override-actions"><button type="button" id="override-cancel" class="secondary">Cancel</button><button type="submit" id="override-submit">Save override</button></div></div></form></dialog><script src="/smart-kds.js?v=8"></script><script src="/smart-kds-controls.js?v=3"></script></body></html>
